[project]
name = "pyfp"
version = "1.0"
description = "A playground for functional-programming concepts in Python"
authors = [
    {name = "pat laplante", email = "laplante.patrick@gmail.com"},
]
readme = "readme.MD"
requires-python = ">=3.9"
license = {text = "MIT"}
# No runtime dependencies: everything runs on the standard library.
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-watcher>=0.4",
]

[tool.uv]
# This is a collection of scripts, not an installable package, so uv should
# manage the environment without trying to build/install the project itself.
package = false

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "src/function",
]

[tool.pyright]
reportUnknownLambdaType = false
reportMissingTypeStubs = false
reportUnknownMemberType = false
exclude = ["__pypackages__", ".venv"]
